name: StackBite macOS Intel TUI lib qualification (T01, private source)
run-name: macos-tui-lib-intel-${{ github.run_id }}
# Intel lane for .github/workflows/native-macos-intel.yml. Manual only: ONE standard public
# macos-15-intel job; independent concurrency group, no retry or automatic triggers.
# PRODUCT = private shinick-dev/stackbite at the commit pinned in ci/mac-tui/mac-tui-pins.json,
# checked out read-only by the pinned actions/checkout with the deploy key passed ONLY as its
# ssh-key input (persist-credentials false). This workflow's own commit is the CI identity H,
# recorded separately and never claimed as the source. Public logs carry only stage/reason enums;
# the only uploaded artifact is $RUNNER_TEMP/public-summary (raw logs stay on the runner).
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: stackbite-macos-tui-lib-intel
  cancel-in-progress: false
jobs:
  tui-lib-intel:
    if: github.repository == 'Shinick-Han/stackbite'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      STACKBITE_MAC_TUI_PINS_FILE: mac-tui-pins-intel.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read pinned private source commit
        id: pin
        run: bash ci/mac-tui/mac-tui-job.sh pins
      - name: Check out pinned private source
        id: private
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shinick-dev/stackbite
          ref: ${{ steps.pin.outputs.commit }}
          path: .ci-private-source
          fetch-depth: 1
          ssh-key: ${{ secrets.STACKBITE_SOURCE_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false
      - name: Native Intel stackbite-terminal-tui --lib
        id: job
        run: bash ci/mac-tui/mac-tui-job.sh run
      - name: Public summary
        if: always()
        env:
          PIN_OUTCOME: ${{ steps.pin.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.private.outcome }}
        run: bash ci/mac-tui/mac-tui-job.sh finalize
      - name: Seal private diagnostics for local decryption
        if: always()
        run: bash ci/mac-tui/seal-diagnostics.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-tui-lib-intel-${{ github.run_id }}
          path: ${{ runner.temp }}/public-summary
          retention-days: 3
          if-no-files-found: error
