name: StackBite native macOS Intel x86_64 0.5.122 (private source)
run-name: native-macos-intel-122-${{ github.run_id }}
# PLATFORM122 (tools/derive122.py): the EXECUTED 0.5.121 native job (build, two equal reproducible lanes,
# MSRV, audits, runtime QA, lifecycle fresh+update, provider trust, connect, ordinary PTY) on the PRIVATE
# product source. Manual only: ONE job on the standard public macos-15-intel runner of Shinick-Han/stackbite,
# no inputs, no retry, no push/PR/tag trigger, no needs, no cache. PRODUCT = private shinick-dev/stackbite
# at the commit pinned in ci/native122-macos/mac122-pins-macos-x86_64.json, checked out read-only by the
# pinned actions/checkout with the deploy key passed ONLY as its ssh-key input (persist-credentials false).
# This workflow's own commit is the CI identity H, recorded separately and never claimed as R. Public logs
# carry only step/exit enums; the only uploaded artifact is $RUNNER_TEMP/public-summary (summary, stripped
# unsigned archive, CMS-encrypted diagnostics). Path = the workflow already registered on the default branch
# (distributor ddd); the overlay lands on a CI branch only, never on main. timeout-minutes 120 is a Root
# PROPOSAL for explicit user approval (current grant 45 min; measured 0.5.121 single job: arm64 36.3 min,
# x86_64 71.9 min, before the added full TUI lib stage). Do not dispatch before Root records that approval.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: stackbite-native-macos-intel-122
  cancel-in-progress: false
jobs:
  native-intel:
    if: github.repository == 'Shinick-Han/stackbite'
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SB122_PLATFORM: macos-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read pinned private source commit
        id: pin
        run: |
          c="$(python3 -I -B ci/native122-macos/mac122.py pin source.commit)"
          [[ "$c" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$c" >> "$GITHUB_OUTPUT"
      - name: Check out pinned private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shinick-dev/stackbite
          ref: ${{ steps.pin.outputs.commit }}
          path: .ci-private-source
          fetch-depth: 1
          ssh-key: ${{ secrets.STACKBITE_SOURCE_DEPLOY_KEY }}
          ssh-strict: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Native Intel x86_64 build, audits, runtime QA, lifecycle, trust, connect and ordinary PTY
        run: bash ci/native122-macos/mac122-job.sh
      - name: Seal private diagnostics for local decryption
        if: always()
        run: bash ci/native122-macos/seal122.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-macos-intel-122-${{ github.run_id }}
          path: ${{ runner.temp }}/public-summary
          retention-days: 3
          if-no-files-found: error
